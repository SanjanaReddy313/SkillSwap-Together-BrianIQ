<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Skill Swap Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="dashboard.html">Skill Swap Platform</a>
    <nav id="dashboardNav"></nav>
  </header>

  <main class="dashboard-page">
    <section class="dashboard-welcome">
      <p class="eyebrow">YOUR SPACE</p>
      <h1>Hello, <span id="dashName">User</span> 👋</h1>
      <p>Manage your skills and connect with other learners.</p>
    </section>

    <section class="dashboard-grid">
      <a class="dash-card" href="discover.html"><div>🔎</div><h3>Browse Skills</h3><p>Find people who can teach you.</p></a>
      <a class="dash-card" href="profile.html"><div>👤</div><h3>My Profile</h3><p>View and update your skills.</p></a>
      <a class="dash-card" href="discover.html"><div>🤝</div><h3>Skill Requests</h3><p>Connect with skill partners.</p></a>
      <a class="dash-card" href="discover.html"><div>💬</div><h3>Messages</h3><p>Start a conversation.</p></a>
    </section>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
