<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Skill Swap Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">Skill Swap Platform</a>
    <nav>
      <a class="nav-btn secondary" href="login.html">Login</a>
      <a class="nav-btn primary" href="signup.html">Sign Up</a>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-heading">
      <h1>Create Account</h1>
      <p>Join the Skill Swap community</p>
    </div>

    <form id="signupForm" class="auth-card">
      <label>Full Name</label>
      <input id="signupName" type="text" placeholder="Enter your name" required>

      <label>Email Address</label>
      <input id="signupEmail" type="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input id="signupPassword" type="password" placeholder="Create a password" required>

      <label>Confirm Password</label>
      <input id="signupConfirm" type="password" placeholder="Confirm your password" required>

      <label>Skills You Offer</label>
      <input id="signupOffer" type="text" placeholder="e.g. Python, JavaScript">

      <label>Skills You Want</label>
      <input id="signupWant" type="text" placeholder="e.g. Photoshop, Excel">

      <button class="full-btn primary" type="submit">Create Account</button>
      <p id="signupMessage" class="message"></p>
      <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
