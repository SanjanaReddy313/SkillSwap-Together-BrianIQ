<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Skill Swap Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="dashboard.html">Skill Swap Platform</a>
    <nav><a class="nav-btn secondary" href="discover.html">Discover</a><a class="nav-btn primary" href="dashboard.html">Dashboard</a></nav>
  </header>

  <main class="profile-page">
    <div class="profile-card">
      <div class="avatar" id="profileAvatar">👤</div>
      <h1 id="profileName">User</h1>
      <p id="profileEmail"></p>
      <div class="profile-section">
        <h3>Skills Offered</h3>
        <div id="profileOffer" class="skill-list"></div>
      </div>
      <div class="profile-section">
        <h3>Skills Wanted</h3>
        <div id="profileWant" class="skill-list"></div>
      </div>
      <button class="full-btn primary" onclick="editProfile()">Edit Profile</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
